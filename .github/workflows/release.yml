name: Mac release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only the native architecture whose dependency lock is supplied is built.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Bootstrap only; the packaged interpreter is separately hash-pinned.
          python-version: '3.12.10'
          architecture: arm64
      - name: Build and test pinned Mac candidate
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            python scripts/release_macos.py --tag "$RELEASE_TAG"
          else
            python scripts/release_macos.py
          fi
      - name: Upload complete candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-release
          path: dist/release/
          if-no-files-found: error
      - name: Retain executed test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-test-results
          path: .test-artifacts/runs/
          include-hidden-files: true

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-release
          path: release
      - name: Verify and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          # Never replace assets on an existing published release. A rerun for an
          # existing draft also fails; inspect/delete the draft before retrying.
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "AFM Workbench $RELEASE_TAG — Mac arm64 candidate" \
            --notes-file release-notes.md \
            ./*.tar.gz build-manifest.json SHA256SUMS release-notes.md
